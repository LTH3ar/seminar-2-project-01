[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4se"
version = "0.1.0"
description = "AI4SE Project 1 - Issue Report Classification (NLBSE'24)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "nltk>=3.8",
]

[project.optional-dependencies]
# Notebook and test environment. Installed by the dev container.
dev = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "pytest>=7.4",
    "ruff>=0.5",
    "nbformat>=5.9",
    "nbconvert>=7.0",
]
# Track B -- classical machine learning. Also cross-checks the hand-written
# metrics and fold splitter in the tests.
ml = ["scikit-learn>=1.3", "scipy>=1.11"]
# Track C -- neural networks.
dl = ["torch>=2.0"]
# Track D2 -- frozen sentence-transformer baselines.
embeddings = ["sentence-transformers>=2.2", "transformers>=4.35"]
# The full SetFit reproduction. Needs a GPU in practice.
setfit = [
    "setfit>=1.0",
    "datasets>=2.14",
    "accelerate>=0.25",
    "sentence-transformers>=2.2",
]
# Everything.
all = [
    "ai4se[dev,ml,dl,embeddings]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pep8-naming, pydocstyle, pyupgrade, bugbear.
# The project is graded on "use of conventions in writing Python code" and
# "documentation through comments", so docstring rules are enabled.
select = ["E", "F", "I", "N", "D", "UP", "B"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pep8-naming]
# N803/N806 flag the capital `X` used for feature matrices. That is the
# universal scikit-learn convention for an estimator's fit/predict signature,
# and renaming it would make the project's models look wrong to any reader who
# knows the library, so these names are exempted rather than worked around.
extend-ignore-names = ["X", "X_train", "X_test", "X_val"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]
"scripts/*" = ["T201"]
