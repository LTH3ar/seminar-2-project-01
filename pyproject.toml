[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4se"
version = "0.1.0"
description = "AI4SE Project 1 - Issue Report Classification (NLBSE'24)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "nltk>=3.8",
]

[project.optional-dependencies]
# Notebook + test environment. Installed by the dev container.
dev = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "pytest>=7.4",
    "ruff>=0.5",
    "nbformat>=5.9",
    "nbconvert>=7.0",
    "scikit-learn>=1.3",
]
# Track B - classical machine learning.
ml = ["scikit-learn>=1.3", "scipy>=1.11"]
# Track C - deep learning, and track D - the SetFit baseline.
dl = [
    "torch>=2.0",
    "transformers>=4.35,<6",
    "datasets>=2.14",
    "sentence-transformers>=2.2",
    "setfit>=1.0",
    "accelerate>=0.25",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20",
]
baseline = [
    "fasttext>=0.9.2",
    "gensim>=4.3",
    "pybind11>=2.11",
    "PyGithub>=1.59",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "wandb>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pep8-naming, pydocstyle, pyupgrade, bugbear.
# The project is graded on "use of conventions in writing Python code" and
# "documentation through comments", so docstring rules are enabled.
select = ["E", "F", "I", "N", "D", "UP", "B"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]
"examples/*" = ["D103"]
