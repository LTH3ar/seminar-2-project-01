[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-report-classifier"
version = "0.2.0"
description = "Data and experiment utilities for NLBSE issue-report classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1,<3",
    "scikit-learn>=1.3,<2",
    "nltk>=3.8,<4",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4",
    "pytest>=7.4",
    "ruff>=0.5",
]
eda = [
    "matplotlib>=3.7",
]
models = [
    "accelerate>=0.26",
    "datasets>=2.16",
    "fasttext>=0.9.2",
    "gensim>=4.3",
    "pybind11>=2.11",
    "PyGithub>=1.59",
    "python-dotenv>=1",
    "sentence-transformers>=2.2",
    "setfit>=1.0",
    "torch>=2",
    "tqdm>=4.66",
    "transformers>=4.35",
    "wandb>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]
